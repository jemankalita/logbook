# Daily Logbook backup + Supabase keep-alive.
# Use in a PRIVATE repository as .github/workflows/backup.yml, with two repository secrets:
#   LOGBOOK_URL   e.g. https://your-app.vercel.app   (no trailing slash)
#   BACKUP_TOKEN  the same value as BACKUP_TOKEN on Vercel
# Each run downloads /api/backup (which also wakes the database) and commits it.
# last-run.txt changes every run, so the repo never looks inactive and GitHub keeps the schedule on.
# A failed run emails you.
name: Logbook backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logbook-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download backup
        env:
          LOGBOOK_URL: ${{ secrets.LOGBOOK_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          # Retries: the first request after a quiet spell can be slow while the database wakes up.
          curl -fsS --retry 2 --retry-delay 30 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer ${BACKUP_TOKEN}" \
            "${LOGBOOK_URL}/api/backup" -o backup.tmp.json
          jq -e '.app == "logbook" and (.tables | type == "object")' backup.tmp.json > /dev/null
          # Sorted and without the timestamp, so git history only shows real data changes.
          jq -S 'del(.exportedAt)' backup.tmp.json > logbook-backup.json
          rm backup.tmp.json
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-run.txt

      - name: Commit
        run: |
          git config user.name "logbook-backup"
          git config user.email "logbook-backup@users.noreply.github.com"
          git add logbook-backup.json last-run.txt
          git commit -m "backup: $(date -u +%F)"
          git push
